[main]
font=Ubuntu Mono Nerd Font:size=14,Noto Sans Mono CJK TC:size=14
line-height=28
prompt="   "
terminal="zashterminal --new-window -e"
icon-theme=Colloid
icons-enabled=yes
horizontal-pad=60
vertical-pad=30
inner-pad=10
image-size-ratio=0.3
lines=10
width=50
letter-spacing=0.5
[border]
radius=24
width=3
[colors]
background = "#00000180"       # Background color (rofi: rgba(0,0,1,0.5))
text = "#FFFFFFff"             # Text (foreground) color of unselected entries
prompt = "#FFFFFFff"           # Text (foreground) color of prompt character(s)
input = "#FFFFFFff"            # Text (foreground) color of input string
match = "#FFFFFFff"            # Text (foreground) color of the matched substring
selection = "#96847Bff"        # Background color of the selected entry (rofi: color11)
selection-text = "#FFFFFFff"   # Text (foreground) color of the selected entry
selection-match = "#FFFFFFff"  # Text (foreground) color of the matched substring of the selected entry
border = "#96847Bff"           # Border color (rofi: color11)